name: Android (prueba técnica Capacitor)

on:
  push:
    branches: [capacitor-prueba]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias y copiar la interfaz
        working-directory: android-app
        run: |
          npm ci
          npm run sync
      - name: Compilar APK de prueba (debug)
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: almanaque-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almanaque-debug-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en un emulador y capturar pantalla y registro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app-debug.apk
            adb logcat -c
            adb shell am start -n cl.mbhspa.almanaque/.MainActivity
            sleep 40
            adb exec-out screencap -p > pantalla-hoy.png
            adb logcat -d > logcat.txt
            grep -E "Capacitor/Console|chromium" logcat.txt > consola.txt || true
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml || true
      - name: Mostrar consola y textos visibles en el registro
        if: always()
        run: |
          echo "=== CONSOLA ==="; cat consola.txt || true
          echo "=== TEXTOS VISIBLES ==="; grep -o 'text="[^"]*"' ui.xml | grep -v 'text=""' || true
      - name: Guardar evidencia en la rama capacitor-evidencia
        if: always()
        run: |
          mkdir -p /tmp/ev && cp pantalla-hoy.png consola.txt ui.xml /tmp/ev/ 2>/dev/null || true
          git init -q ev && cd ev
          git config user.email "noreply@anthropic.com"; git config user.name "Claude"
          git checkout -q -b capacitor-evidencia
          cp /tmp/ev/* . && echo "Corrida ${GITHUB_RUN_ID} sobre ${GITHUB_SHA}" > LEEME.txt
          git add -A && git commit -q -m "Evidencia de la corrida ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" capacitor-evidencia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: almanaque-prueba-emulador
          path: |
            pantalla-hoy.png
            consola.txt
            logcat.txt
