name: Android (prueba técnica Capacitor)

on:
  push:
    branches: [capacitor-prueba]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias y copiar la interfaz
        working-directory: android-app
        run: |
          npm ci
          npm run sync
      - name: Compilar APK de prueba (debug)
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: almanaque-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: almanaque-debug-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en un emulador y capturar pantalla y registro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r app-debug.apk
            adb logcat -c
            adb shell am start -n cl.mbhspa.almanaque/.MainActivity
            sleep 40
            adb exec-out screencap -p > pantalla-hoy.png
            adb logcat -d > logcat.txt
            grep -E "Capacitor/Console|chromium" logcat.txt > consola.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: almanaque-prueba-emulador
          path: |
            pantalla-hoy.png
            consola.txt
            logcat.txt
