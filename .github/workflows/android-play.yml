name: Android (versión para Google Play)

# Se ejecuta a mano desde la pestaña Actions ("Run workflow").
# Compila el paquete firmado (AAB) que se sube a Google Play Console.
# Requiere los secretos del repositorio: ALMANAQUE_KEYSTORE_B64, ALMANAQUE_KEYSTORE_PASSWORD,
# ALMANAQUE_KEY_ALIAS y ALMANAQUE_KEY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versión (entero; súbelo en 1 cada vez que publiques una actualización)"
        required: true
        default: "1"

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Revisar que existan los secretos de firma
        env:
          B64: ${{ secrets.ALMANAQUE_KEYSTORE_B64 }}
          SP: ${{ secrets.ALMANAQUE_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ALMANAQUE_KEY_ALIAS }}
          KP: ${{ secrets.ALMANAQUE_KEY_PASSWORD }}
        run: |
          for v in B64 SP AL KP; do if [ -z "${!v}" ]; then echo "Falta un secreto de firma ($v). Revisa Settings > Secrets and variables > Actions."; exit 1; fi; done
      - name: Instalar dependencias y copiar la interfaz
        working-directory: android-app
        run: |
          npm ci
          npm run sync
      - name: Compilar el AAB firmado
        working-directory: android-app/android
        env:
          ALMANAQUE_KEYSTORE_PASSWORD: ${{ secrets.ALMANAQUE_KEYSTORE_PASSWORD }}
          ALMANAQUE_KEY_ALIAS: ${{ secrets.ALMANAQUE_KEY_ALIAS }}
          ALMANAQUE_KEY_PASSWORD: ${{ secrets.ALMANAQUE_KEY_PASSWORD }}
          ALMANAQUE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          echo "${{ secrets.ALMANAQUE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/subida.jks"
          export ALMANAQUE_KEYSTORE="$RUNNER_TEMP/subida.jks"
          ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/subida.jks"
          ls -l app/build/outputs/bundle/release/
      - name: Comprobar la firma
        run: |
          jarsigner -verify android-app/android/app/build/outputs/bundle/release/app-release.aab | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: almanaque-play-aab-v${{ inputs.version_code }}
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
